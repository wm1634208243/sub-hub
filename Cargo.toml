[package]
name = "subhub"
version = "2.4.4"
edition = "2021"
authors = ["SubHub Team"]
description = "High-performance Clash / Mihomo / Sing-Box subscription aggregator and rule routing platform in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
regex = "1.10"
lazy_static = "1.5"
base64 = "0.22"
url = "2.5"
bcrypt = "0.15"
aes-gcm = "0.10"
scrypt = "0.11"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8.4"
mime_guess = "2.0"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
percent-encoding = "2.3"
